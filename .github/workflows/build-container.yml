name: Build map-travel container

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - .dockerignore
      - Cargo.lock
      - Cargo.toml
      - Dockerfile
      - frontend/**
      - migration/**
      - scripts/vendor-basemap-assets.mjs
      - src/**
      - templates/**
      - .github/workflows/build-container.yml
  pull_request:
    paths:
      - .dockerignore
      - Cargo.lock
      - Cargo.toml
      - Dockerfile
      - frontend/**
      - migration/**
      - scripts/vendor-basemap-assets.mjs
      - src/**
      - templates/**
      - .github/workflows/build-container.yml

permissions:
  contents: read

jobs:
  build:
    uses: docker/github-builder/.github/workflows/build.yml@a492c6d04fd3315f67230809b44d60cc0acd50b3 # v1
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      cache: true
      cache-mode: max
      context: .
      file: Dockerfile
      output: image
      platforms: linux/amd64,linux/arm64
      push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      sbom: true
      target: runtime
      meta-images: ghcr.io/${{ github.repository_owner }}/map-travel
      meta-tags: |
        type=raw,value=build-{{date 'YYYYMMDD-HHmmss'}}
        type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
        type=raw,value=${{ github.sha }},enable=${{ github.event_name == 'pull_request' }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
