[workspace]
members = ["migration"]

[package]
name = "map-travel"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["multipart", "macros"] }
bytes = "1.11.1"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive", "env"] }
geojson = "1.0.0"
gpx = "0.10.0"
migration = { version = "0.1.0", path = "migration" }
pmtiles = { version = "0.23.0", default-features = false, features = ["http-async", "mmap-async-tokio", "reqwest-rustls", "tilejson", "write"] }
sea-orm = { version = "1.1.20", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-chrono"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread", "fs", "sync", "time"] }
tower-http = { version = "0.6.8", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.23.1", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1.3"
mime = "0.3.17"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
